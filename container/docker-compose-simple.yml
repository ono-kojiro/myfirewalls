---
services:
  server:
    image: ${IMAGE}
    container_name: server
    hostname: server
    restart: always
    stdin_open: true
    tty: true
    
    networks:
      wan:
        ipv4_address: 172.16.0.42

    cap_add:
    - NET_ADMIN

    environment:
      TZ: Asia/Tokyo
      LDAP_URI: ${LDAP_URI}
      LDAP_BASE: ${LDAP_BASE}
      LDAP_START_TLS: ${LDAP_START_TLS}
      LDAP_TLS_REQCERT: ${LDAP_TLS_REQCERT}
      LDAP_ALLOW_GROUPS: ${LDAP_ALLOW_GROUPS}

