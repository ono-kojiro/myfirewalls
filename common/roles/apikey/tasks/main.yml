---

- name: create api key
  ansible.builtin.shell: |
    key=`openssl rand -base64 48`
    secret=`openssl rand -hex 32`
    ipv4=`ifconfig vtnet0 | grep 'inet ' | awk '{ print $2 }'`
    {
      echo "key='$key'"
      echo "secret='$secret'"

    } | tee /tmp/apikey.shrc
    
  register: res

- name: show apikey
  ansible.builtin.debug:
    var: res.stdout_lines

- name: add apikeys
  ansible.builtin.shell: |
    config_xml="/conf/config.xml"
    . /tmp/apikey.shrc; \
    hash=`openssl passwd -6 "$secret"`; \
    sed -i -e "s|<apikeys/>|<apikeys>$key\|$hash</apikeys>|" $config_xml

- name: replace apikeys
  ansible.builtin.shell: |
    config_xml="/conf/config.xml"
    . /tmp/apikey.shrc; \
    hash=`openssl passwd -6 "$secret"`; \
    sed -i -e "s|<apikeys>.*</apikeys>|<apikeys>$key\|$hash</apikeys>|" $config_xml

- name: fetch apikey
  ansible.builtin.fetch:
    src: /tmp/apikey.shrc
    dest: "./.env"
    flat: yes

- name: show info
  ansible.builtin.debug:
    msg: "apikeys was saved in ./.env"

- name: read apikeys
  ansible.builtin.shell :
    cat /conf/config.xml | grep apikeys
  register: res

- name: show apikey again
  ansible.builtin.debug:
    var: res.stdout_lines

- name: remove apikey in remote
  ansible.builtin.file:
    path: /tmp/apikey.shrc
    state: absent

- name: reload all services
  ansible.builtin.shell: |
    /usr/local/sbin/opnsense-shell reload &

